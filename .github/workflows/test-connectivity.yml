name: Test Source Connectivity Matrix

on:
  workflow_dispatch:

jobs:
  test-connectivity:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Diagnostics
        run: node scripts/diagnose-onrc.js
