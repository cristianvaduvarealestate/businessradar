name: Deep Network Tracer for data.gov.ro

on:
  workflow_dispatch:

jobs:
  trace-network:
    name: Network Tracer (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Network Tools
        run: sudo apt-get update && sudo apt-get install -y traceroute tcptraceroute mtr-tiny iputils-ping dnsutils

      - name: Egress IP Identification
        run: |
          echo "=== RUNNER PUBLIC IP & REGION ==="
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner Public IP: $RUNNER_IP"
          curl -s https://ipinfo.io/$RUNNER_IP/json || true

      - name: DNS Resolution Test
        run: |
          echo "=== DNS LOOKUP FOR data.gov.ro ==="
          dig +trace data.gov.ro || true
          nslookup data.gov.ro || true

      - name: Port 80 HTTP Probe
        run: |
          echo "=== PORT 80 (HTTP) PROBE ==="
          curl -Iv --connect-timeout 10 http://data.gov.ro/ || true

      - name: Port 443 HTTPS Probe
        run: |
          echo "=== PORT 443 (HTTPS) PROBE ==="
          curl -Iv --connect-timeout 10 https://data.gov.ro/ || true

      - name: Direct Resource Probe with Headers
        run: |
          echo "=== DIRECT RESOURCE PROBE ==="
          curl -Iv --connect-timeout 10 "https://data.gov.ro/dataset/c2c88c9d-4824-45f1-90ec-656f1c0d8785/resource/869eac01-8480-4ac6-a18d-d0f044b0db80/download/od_firme.csv" || true

      - name: ICMP Traceroute
        run: |
          echo "=== ICMP TRACEROUTE TO 85.120.75.35 ==="
          traceroute -m 25 -w 2 85.120.75.35 || true

      - name: TCP SYN Traceroute Port 443
        run: |
          echo "=== TCP SYN TRACEROUTE TO 85.120.75.35:443 ==="
          sudo tcptraceroute -m 25 -w 2 85.120.75.35 443 || true

      - name: TCP SYN Traceroute Port 80
        run: |
          echo "=== TCP SYN TRACEROUTE TO 85.120.75.35:80 ==="
          sudo tcptraceroute -m 25 -w 2 85.120.75.35 80 || true
